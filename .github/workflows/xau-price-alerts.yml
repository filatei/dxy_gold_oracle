name: XAUUSD Price Level Alerts

on:
  schedule:
    # Every 15 minutes during market hours (Mon–Fri 06:00–23:00 UTC)
    - cron: '*/15 6-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  price-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run XAUUSD price alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional overrides (repo Variables or leave unset for config defaults):
          # XAU_ALERT_MOVE_PCT: ${{ vars.XAU_ALERT_MOVE_PCT }}
          # XAU_ALERT_WINDOW_BARS: ${{ vars.XAU_ALERT_WINDOW_BARS }}
          # XAU_ALERT_LEVEL_STEP: ${{ vars.XAU_ALERT_LEVEL_STEP }}
          # XAU_ALERT_LEVEL_PROXIMITY: ${{ vars.XAU_ALERT_LEVEL_PROXIMITY }}
          # XAU_ALERT_COOLDOWN_MINUTES: ${{ vars.XAU_ALERT_COOLDOWN_MINUTES }}
        run: python -m src.main --price-alerts

      - name: Commit alert cooldown state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/xau_price_alert_state.json ]; then
            git add -f data/xau_price_alert_state.json
            if git diff --cached --quiet; then
              echo "Alert state unchanged"
            else
              git commit -m "chore: update xau price alert state [skip ci]"
              git push
            fi
          else
            echo "No alert state file written"
          fi
